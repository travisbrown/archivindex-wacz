[workspace]
members = ["crates/*", "tools/*"]
resolver = "3"

[workspace.package]
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
repository = "https://github.com/travisbrown/archivindex-wacz"
keywords = ["warc", "web", "archive"]
edition = "2024"
rust-version = "1.97"
readme = "README.md"
license = "GPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
archivindex-archiver = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-warc" }
archivindex-cdx = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-cli-support = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-digest = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-lines = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-publication = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-serde = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-surt = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-test-support = { git = "https://github.com/travisbrown/archivindex" }
archivindex-wacz = { version = "0.1.0", path = "crates/wacz" }
archivindex-warc = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-warc", default-features = false }
bounded-static = "0.8"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
data-encoding = "2"
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
# The WARC crate takes and returns URI-valued header fields as `fluent_uri::Uri<String>`.
fluent-uri = "0.4"
log = "0.4"
proptest = "1"
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
test-strategy = "0.4"
thiserror = "2"
# WARC and gzip-compressed members use ZIP STORE; metadata and plain indexes use DEFLATE.
# `flate2` handles gzip content separately.
zip = { version = "8", default-features = false, features = ["deflate-flate2", "deflate-zopfli"] }

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
