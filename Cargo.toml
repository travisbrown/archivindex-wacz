[workspace]
members = [
  "cdx",
  "cli-support",
  "packager",
  "packager-cli",
  "surt",
  "wacz",
  "wordpress",
  "wordpress-cli",
]
resolver = "3"

[workspace.package]
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
repository = "https://github.com/travisbrown/archivindex"
keywords = ["warc", "web", "archive"]
edition = "2024"
rust-version = "1.97"
readme = "README.md"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
archivindex-archiver = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-warc", branch = "archiver-config" }
archivindex-cdx = { version = "0.1.0", path = "cdx" }
archivindex-cli-support = { version = "0.1.0", path = "cli-support" }
archivindex-surt = { version = "0.1.0", path = "surt" }
archivindex-wacz = { version = "0.1.0", path = "wacz" }
# Keep the shared declaration feature-free. Each consumer enables only the WARC capabilities it
# uses, so lightweight readers do not inherit the archiver's HTTP and payload-identification stack.
archivindex-warc = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-warc", branch = "archiver-config", default-features = false }
# Feature-free as well: the borrowing models opt into `derive`, and only WACZ needs `chrono`.
bounded-static = "0.8"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
# The WARC crate takes and returns URI-valued header fields as `fluent_uri::Uri<String>`.
fluent-uri = "0.4"
log = "0.4"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
test-strategy = "0.4"
thiserror = "2"
url = "2"

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
