[package]
name = "archivindex-packager-cli"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "archivindex-packager"
path = "src/main.rs"
