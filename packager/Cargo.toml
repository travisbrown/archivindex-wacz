[package]
name = "archivindex-packager"
description = "Packaging WARC captures as indexed WACZ distributions"
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/crate/archivindex-packager/"
keywords = ["warc", "wacz", "web", "archive"]
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
archivindex-cdx.workspace = true
archivindex-surt.workspace = true
archivindex-wacz.workspace = true
archivindex-warc = { workspace = true, features = ["gzip", "http"] }
chrono.workspace = true
redb = "4"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
archivindex-archiver.workspace = true
flate2.workspace = true
# Integration tests inspect WARC records, whose target URIs are `fluent_uri::Uri<String>` values.
fluent-uri.workspace = true
proptest.workspace = true
test-strategy.workspace = true
