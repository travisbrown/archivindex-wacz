[package]
name = "archivindex-archiver"
description = "Archiving web pages over HTTP into WARC files"
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/crate/archivindex-archiver/"
keywords = ["warc", "web", "archive", "http"]
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
archivindex-warc-revisit-index = { version = "0.1.0", path = "../warc-revisit-index/" }
archivindex-warc = { workspace = true, features = [
  "gzip",
  "payload-identification",
  "recorder",
  "serde",
] }
chrono.workspace = true
fluent-uri.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
sha2.workspace = true
flate2.workspace = true
archivindex-packager = { version = "0.1.0", path = "../packager/" }
archivindex-surt = { version = "0.1.0", path = "../surt/" }
archivindex-wacz = { version = "0.1.0", path = "../wacz/" }
